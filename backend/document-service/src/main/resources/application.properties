server.port=8082
spring.application.name=document-service

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.datasource.url=${DOCUMENT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DOCUMENT_DB_USERNAME}
spring.datasource.password=${DOCUMENT_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.sql.init.mode=${DOCUMENT_DB_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

kyc.storage.directory=${KYC_STORAGE_DIRECTORY:./kyc-storage}
kyc.ocr.tessdata-path=${TESSDATA_PATH:}
kyc.ocr.minimum-confidence=${OCR_MINIMUM_CONFIDENCE:50}

management.endpoints.web.exposure.include=health,info,metrics
audit.service.url=http://localhost:8085


security.jwt.customer-secret=${CUSTOMER_JWT_SECRET}
security.jwt.review-secret=${REVIEW_JWT_SECRET}
# ==========================================
# CUSTOMER MICROSERVICE
# ==========================================

server.port=8081
spring.application.name=customer-service

# ==========================================
# EUREKA SERVICE DISCOVERY
# ==========================================

eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

# ==========================================
# ORACLE DATABASE
# ==========================================

spring.datasource.url=${CUSTOMER_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${CUSTOMER_DB_USERNAME:KYC_AUTOMATE}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==========================================
# DOCUMENT MICROSERVICE
# ==========================================

services.document.url=${DOCUMENT_SERVICE_URL:http://localhost:8082}
#added audit service url
audit.service.url=http://localhost:8085
# ==========================================
# OPENFEIGN CONFIGURATION
# ==========================================

spring.cloud.openfeign.client.config.document-service.connectTimeout=3000
spring.cloud.openfeign.client.config.document-service.readTimeout=5000

# ==========================================
# INTERNAL MICROSERVICE AUTHENTICATION
# ==========================================

internal.auth.verification-password=${VERIFICATION_SERVICE_PASSWORD}
internal.auth.decision-password=${DECISION_SERVICE_PASSWORD}

# ==========================================
# SPRING BOOT ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true

info.app.name=KYC Automate Customer Service
info.app.description=Customer onboarding and KYC application management
info.app.version=0.0.1
# JWT access tokens: supply a Base64-encoded random secret in the launch environment.
security.jwt.secret=${CUSTOMER_JWT_SECRET}
security.jwt.issuer=kyc-customer
security.jwt.audience=kyc-customer-api
security.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}

# JJWT security extension
internal.outbound.password=${CUSTOMER_SERVICE_PASSWORD}

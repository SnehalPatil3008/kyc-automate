
spring.application.name=customer-service
server.port=8081
server.address=127.0.0.1

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=KYC_AUTOMATE
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

services.document.url=http://localhost:8082

spring.cloud.openfeign.client.config.document-service.connectTimeout=3000
spring.cloud.openfeign.client.config.document-service.readTimeout=5000

eureka.client.enabled=false


internal.auth.verification-password=${VERIFICATION_SERVICE_PASSWORD}
internal.auth.decision-password=${DECISION_SERVICE_PASSWORD}

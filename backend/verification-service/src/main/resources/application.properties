server.port=8083
spring.application.name=verification-service

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.datasource.url=${VERIFICATION_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${VERIFICATION_DB_USERNAME:kyc}
spring.datasource.password=${VERIFICATION_DB_PASSWORD:kyc}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.sql.init.mode=${VERIFICATION_DB_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

verification.name-threshold=${NAME_SIMILARITY_THRESHOLD:80}
verification.address-threshold=${ADDRESS_SIMILARITY_THRESHOLD:60}

management.endpoints.web.exposure.include=health,info,metrics

# ==========================================
# CUSTOMER MICROSERVICE
# ==========================================

services.customer.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}

# ==========================================
# CUSTOMER SERVICE INTERNAL AUTHENTICATION
# ==========================================

customer.service.username=${CUSTOMER_SERVICE_USERNAME:verification-service}
customer.service.password=${CUSTOMER_SERVICE_PASSWORD:${VERIFICATION_SERVICE_PASSWORD:verify@123}}

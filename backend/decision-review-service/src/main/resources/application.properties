
server.port=8084
spring.application.name=decision-review-service

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Oracle
spring.datasource.url=${DECISION_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DECISION_DB_USERNAME:KYC_DECISION}
spring.datasource.password=${DECISION_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Customer Service internal authentication
internal.customer.username=decision-service
internal.customer.password=${DECISION_SERVICE_PASSWORD}

# Local reviewer account
review.auth.username=${REVIEW_USERNAME:reviewer}
review.auth.password=${REVIEW_PASSWORD}

# OpenFeign
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000

# Actuator
management.endpoints.web.exposure.include=health,info

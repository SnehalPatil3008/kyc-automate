spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[1].id=customer-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/customers/**

spring.cloud.gateway.server.webflux.routes[0].id=document-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://DOCUMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/documents/**

spring.cloud.gateway.server.webflux.routes[2].id=verification-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://VERIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/verifications/**

spring.cloud.gateway.server.webflux.routes[3].id=decision-review-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://DECISION-REVIEW-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/reviews/**

spring.cloud.gateway.server.webflux.routes[4].id=audit-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://AUDIT-REPORTING-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/audit/**


#jwt authentication routings
spring.cloud.gateway.server.webflux.routes[5].id=customer-auth-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[6].id=customer-kyc-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/kyc/**

security.jwt.secret=${CUSTOMER_JWT_SECRET:tDeClY8Z50HbAt4MDKhoqUwUWtZTCd/hZjwImZbcIqs=}
security.jwt.issuer=${JWT_ISSUER:kyc-customer}
security.jwt.audience=${JWT_AUDIENCE:kyc-customer-api}


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=TRACE
logging.level.org.springframework.cloud.gateway=DEBUG

management.endpoints.web.exposure.include=health,info,gateway

#CORS HEADERS
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST